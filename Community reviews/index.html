<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PrinceHacky Community Reviews</title>

    <link
        rel="stylesheet"
        href="css/reviews.css">

</head>

<body>

    <header class="page-header">

        <h1>PrinceHacky Community Reviews</h1>

        <p>
            Browse games and read community reviews.
        </p>

    </header>

    <main>

        <section>

            <h2>Browse Games</h2>

            <div
                id="app"
                class="games-grid">

                <p>Loading games...</p>

            </div>

        </section>

    </main>

    <!-- Supabase library -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <!-- Configuration -->
    <script
        defer
        src="js/config.js">
    </script>

    <!-- Supabase client -->
    <script
        defer
        src="js/supabase.js">
    </script>

    <!-- Database API -->
    <script
        defer
        src="js/api.js">
    </script>

    <!-- Page logic -->
    <script
        defer
        src="js/reviews.js">
    </script>

</body>

</html>
